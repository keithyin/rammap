[workspace]
resolver = "2"
members = ["bandmap-core", "bandmap"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/keithyin/rammap"
# Shared across both crates; the path is resolved relative to the workspace root.
readme = "README.md"

# Shared release profile (applies to all workspace members).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
